name: CI

# Runs the same baseline verification as ./init.sh on every pull request and on every push to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (init.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests run offline: no API keys, no tracing.
      OPIK_TRACK_DISABLE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Run init.sh
        run: ./init.sh
