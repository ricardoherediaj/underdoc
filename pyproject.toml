[project]
name = "underdoc"
version = "0.1.0"
description = "Turn an approved post idea into a Substack draft in Ricardo's voice: research (Nova), writing (Brown) and the Underdoc MCP server."
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py314"
